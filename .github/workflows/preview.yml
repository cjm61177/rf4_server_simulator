name: Preview Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-main
  cancel-in-progress: true

jobs:
  preview:
    name: Build Preview Package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build preview package
        id: package
        run: bash .github/scripts/build-preview.sh "$GITHUB_SHA"

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: RF4 Server Simulator ${{ steps.package.outputs.version }}
          body_path: ${{ steps.package.outputs.release_notes }}
          files: ${{ steps.package.outputs.asset_path }}
          prerelease: true

      # 回写 version.json（preview 通道）供客户端更新检测；[skip ci] 防回环。
      - name: Write back version.json (preview)
        env:
          VERSION_WRITEBACK_DEPLOY_KEY: ${{ secrets.VERSION_WRITEBACK_DEPLOY_KEY }}
          VERSION_WRITEBACK_REMOTE: git@ssh.github.com:glance522/rf4_server_simulator.git
        run: |
          key_file="$RUNNER_TEMP/rf4-version-writeback"
          printf '%s\n' "$VERSION_WRITEBACK_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H -p 443 ssh.github.com > "$RUNNER_TEMP/rf4-known-hosts"
          export GIT_SSH_COMMAND="ssh -p 443 -i $key_file -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/rf4-known-hosts -o StrictHostKeyChecking=yes"
          bash .github/scripts/update-version-json.sh preview "${{ steps.package.outputs.version }}" "${{ steps.package.outputs.build_ts }}" "${{ steps.package.outputs.asset_name }}"

      # jsDelivr 对 @main 引用有最长约 12h 缓存；best-effort 清缓存，失败不阻塞。
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          curl -sf -X POST https://purge.jsdelivr.net/ \
            -H 'Content-Type: application/json' \
            -d '{"path":["/gh/glance522/rf4_server_simulator@main/version.json"]}' \
            || echo "purge 失败（缓存最多 12h 后自动过期）"

      - name: Keep latest preview release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keep = 1;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const previews = releases
              .filter((release) => release.tag_name.startsWith('preview-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`Found ${previews.length} preview releases; keeping ${keep}.`);
            for (const release of previews.slice(keep)) {
              core.info(`Deleting old preview ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }
            }
